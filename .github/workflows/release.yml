name: Release

# 触发方式：
#   1) 推 tag（v1.2.3 / v1.2.3-beta.1）→ 自动构建并发布 Release
#   2) 手动触发 → 填一个已存在的 tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag，例如 v1.0.0'
        required: true
        type: string

# 创建 Release / 上传产物需要写权限
permissions:
  contents: write

env:
  APP_NAME: AStation.Client
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ─────────────────────────── 构建矩阵：自包含 / 框架依赖 ───────────────────────────
  build:
    name: Build x64 (${{ matrix.flavor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - self_contained: 'true'
            flavor: self-contained
            required_runtime: '无需安装 .NET，解压即用'
          - self_contained: 'false'
            flavor: framework-dependent
            required_runtime: '需先安装 .NET 10 Desktop Runtime（x64）'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── 版本号全部从 tag 推导，tag 不合法直接失败，避免发出版本号混乱的包 ──
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ([string]::IsNullOrWhiteSpace($env:TAG_INPUT)) { $env:REF_NAME } else { $env:TAG_INPUT }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?)$') {
            throw "tag '$tag' 不是合法的 semver，请用 v1.2.3 或 v1.2.3-beta.1 形式"
          }
          $version = $Matches[1]
          "version=$version"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"               | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号：$version（来源 tag：$tag）"

      - name: Restore
        run: dotnet restore AStation.Client.csproj -r win-x64

      # ── 发布 ──
      # SelfContained 由矩阵决定（.NET 运行时是否内置）；
      # WindowsAppSDKSelfContained 始终为 true —— Windows App Runtime 不打进系统，
      # 否则用户还得单独装对应版本的 WinAppRuntime 框架包，装错版本会直接启动崩溃。
      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SELF_CONTAINED: ${{ matrix.self_contained }}
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "publish-${{ matrix.flavor }}"
          dotnet publish AStation.Client.csproj `
            -c Release `
            -r win-x64 `
            --self-contained $env:SELF_CONTAINED `
            -p:Platform=x64 `
            -p:Version=$env:VERSION `
            -p:AssemblyVersion=$($env:VERSION.Split('-')[0]) `
            -p:FileVersion=$($env:VERSION.Split('-')[0]) `
            -p:InformationalVersion=$env:VERSION `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -p:EnableMsixTooling=false `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $outDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败（exit $LASTEXITCODE）" }
          if (-not (Test-Path (Join-Path $outDir "$env:APP_NAME.exe"))) {
            throw "发布目录里没有 $env:APP_NAME.exe"
          }
          "out_dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "产物：$outDir（$((Get-ChildItem $outDir -File).Count) 个文件，$([math]::Round((Get-ChildItem $outDir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)) MB）"
        id: publish

      # ── 打包：包名 = 应用名-版本号-运行时-构建类型 ──
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OUT_DIR: ${{ steps.publish.outputs.out_dir }}
        run: |
          $zipName = "$env:APP_NAME-$env:VERSION-win-x64-${{ matrix.flavor }}.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          # 优先用 7z（几百 MB 的目录比 Compress-Archive 快一个数量级），没有则退回 tar/Compress-Archive
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            $candidate = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (Test-Path $candidate) { $sevenZip = Get-Item $candidate }
          }

          Push-Location $env:OUT_DIR
          try {
            if ($sevenZip) {
              $exe = if ($sevenZip.Source) { $sevenZip.Source } else { $sevenZip.FullName }
              & $exe a -tzip -mx=5 -mmt=on $zipPath '*'
            } else {
              tar -a -c -f $zipPath '*'
            }
            if ($LASTEXITCODE -ne 0) { throw "压缩失败（exit $LASTEXITCODE）" }
          } finally {
            Pop-Location
          }

          $sizeMb = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "打包完成：$zipName（$sizeMb MB）"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_size=$sizeMb"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────── 汇总发布 ───────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ([string]::IsNullOrWhiteSpace($env:TAG_INPUT)) { $env:REF_NAME } else { $env:TAG_INPUT }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?)$') {
            throw "tag '$tag' 不是合法的 semver"
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"               | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $selfContained = "$env:APP_NAME-$env:VERSION-win-x64-self-contained.zip"
          $frameworkDep  = "$env:APP_NAME-$env:VERSION-win-x64-framework-dependent.zip"

          $notes = @"
          AcFun 第三方桌面客户端 $env:VERSION（Windows 10 1809+ / x64）

          ## 下载哪个

          | 包 | 说明 |
          |---|---|
          | ``$selfContained`` | **自包含**：内置 .NET 运行时，解压后双击 ``$env:APP_NAME.exe`` 即可运行 |
          | ``$frameworkDep`` | **框架依赖**：体积更小，需先安装 [.NET 10 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0) |

          两个版本都已内置 Windows App SDK 运行时，不需要额外安装 Windows App Runtime。
          下载后解压到任意目录运行（不要放在需要管理员权限的路径下），``SHA256SUMS.txt`` 可用于校验完整性。
          "@

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          # here-string 带缩进，去掉每行前导空格
          ($notes -split "`r?`n" | ForEach-Object { $_.TrimStart() }) -join "`n" |
            Set-Content $notesPath -Encoding utf8

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG 已存在，覆盖资产"
            gh release upload $env:TAG dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit $env:TAG --notes-file $notesPath
          } else {
            Write-Host "创建 Release $env:TAG"
            gh release create $env:TAG dist/*.zip dist/SHA256SUMS.txt `
              --title "$env:APP_NAME $env:VERSION" `
              --notes-file $notesPath `
              --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "发布失败（exit $LASTEXITCODE）" }
          gh release view $env:TAG --json url --jq .url
